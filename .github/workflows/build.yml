name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VER=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Ibra-APK-Share-v${VER}.apk"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Ibra-APK-Share
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Ibra APK Share v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            Ibra APK Share v${{ env.VER }}
            - عرض التطبيقات المثبتة مع خيار تطبيقات النظام
            - إرسال APK عبر البلوتوث
            - حفظ APK في Download/Ibra APK Share
            برمجة وتطوير ابراهيم الخزرجي
